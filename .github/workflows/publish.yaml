# .github/workflows/publish.yaml
name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    # Fix: grant permission to create and upload to GitHub Releases
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: komit-linux-x86_64
          - os: macos-13
            name: komit-macos-x86_64
          - os: macos-latest
            name: komit-macos-arm64
          - os: windows-latest
            name: komit-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyinstaller ollama

      - name: Build binary
        run: pyinstaller --onefile komit/main.py --name ${{ matrix.name }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: |
          uv sync --dev
          uv run python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}