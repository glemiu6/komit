# .github/workflows/release.yaml
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Install PyInstaller
        run: pip install pyinstaller
      
      - name: Build binary
        run: pyinstaller --onefile commit_helper/main.py --name kommit
      
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kommit-${{ matrix.os }}
          path: dist/kommit*