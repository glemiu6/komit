[project]
name = "komit"
version = "0.4.2"
description = "AI-powered git commit message generator using local LLMs"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache 2.0" }
authors = [
    { name = "Vlad Digori", email = "digorivlad59@gmail.com" }
]
keywords = ["git", "commit", "ai", "llm", "ollama", "developer-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.4.0",
    "pip>=26.1.1",
    "platformdirs>=4.9.6",
    "requests>=2.33.1",
    "rich>=15.0.0",
]

[project.scripts]
komit = "komit.main:run"
komit-update = "komit.update_utils:update_pip"
komit-update-binary = "komit.update_utils:update_binary"
komit-uninstall = "komit.update_utils:uninstall"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "build>=1.4.4",
    "twine>=6.2.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/glemiu6/komit"
Repository = "https://github.com/glemiu6/komit"
"Bug Tracker" = "https://github.com/glemiu6/komit/issues"
